<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wallet | GoldMine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Ethers.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVIGATION -->
<nav class="main-nav">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">GoldMine</a>
    <div class="nav-links">
      <a href="index.html">Games</a>
      <a href="wallet.html" class="active">Wallet</a>
      <a href="buy-tokens.html">Buy Tokens</a>
      <a href="funding.html">Funding</a>
    </div>
  </div>
</nav>

<!-- WALLET SECTION -->
<section class="games">
  <h2>Wallet Status</h2>

  <div class="wallet-card">
    <button id="connectBtn" class="connect-btn">Connect MetaMask</button>

    <div class="wallet-info">
      <div class="info-item">
        <span class="label">Address:</span>
        <span id="walletAddress" class="value">—</span>
      </div>
      <div class="info-item">
        <span class="label">Network:</span>
        <span id="network" class="value">—</span>
      </div>
      <div class="info-item">
        <span class="label">ETH Balance:</span>
        <span id="ethBalance" class="value">—</span>
      </div>
      <div class="info-item">
        <span class="label">Reward Token (GMAT) Balance:</span>
        <span id="tokenBalance" class="value">—</span>
      </div>
    </div>

    <div id="txStatus"></div>
  </div>
</section>

<footer class="footer">
  GoldMine Early Access Platform · Ethereum Testnet Only
</footer>

<script src="utils.js"></script>
<script src="wallet.js"></script>
</body>
</html>
